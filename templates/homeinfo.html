<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/homeinfo.css">
    <title>Meu Quarto</title>
</head>
<body>

    <h1 style="color: var(--accent);">Controle do Quarto</h1>

    <div class="dashboard">
        <div class="card">
            <h2>Controle da Janela</h2>
            <div class="btn-group">
                <button class="btn btn-action" onclick="fetch('/interf/abrir')">ABRIR</button>
                <button class="btn btn-off" onclick="fetch('/interf/desligar')">FECHAR</button>
            </div>
        </div>

        <div class="card">
            <h2>Ar Condicionado</h2>
            <div class="btn-group">
                <button class="btn btn-on" onclick="fetch('/interf/ligarar')">LIGAR</button>
                <button class="btn btn-off" onclick="fetch('/interf/desligarar')">DESLIGAR</button>
            </div>
        </div>

        <div class="card">
            <h2>Modo Dormir</h2>
            <label class="switch">
                <input type="checkbox" id="toggle-dormir" onchange="toggleDormir()">
                <span class="slider"></span>
            </label>
            <p id="status-dormir" style="margin-top: 15px; font-weight: bold; color: var(--danger);">Status: DESATIVADO</p>
        </div>



        <div class="card">
            <h2>Limite de Temperatura</h2>
            <div class="temp-control">
                <button class="circle-btn" onclick="ajustarTemp(-0.5)">-</button>
                <span id="temp-display">26.5°C</span>
                <button class="circle-btn" onclick="ajustarTemp(0.5)">+</button>
            </div>
        </div>

        <div class="card" style="grid-column: 1 / -1;">
            <h2>Visualização Histórica (Últimas 24h)</h2>
            <div class="btn-group">
                <a href="/graficotemp" target="_blank" class="btn btn-nav">VER GRÁFICO DE TEMPERATURA</a>
                <a href="/graficoumidade" target="_blank" class="btn btn-nav">VER GRÁFICO DE UMIDADE</a>
            </div>
        </div>
    </div>

    <script>
        let tempLimite = 26.5;
        function ajustarTemp(v) {
            tempLimite += v;
            document.getElementById('temp-display').innerText = tempLimite + "°C";
            fetch(`/interf/ajustar_limite?temp=${tempLimite}`, {method:'GET'});
        }

        function toggleDormir() {
            const checkbox = document.getElementById('toggle-dormir');
            const statusText = document.getElementById('status-dormir');

            fetch('/interf/dormir', { method: 'POST' })
                .then(response => response.json())
                .then(data => {

                    checkbox.checked = data.modo_dormir;

                    if (data.modo_dormir) {
                        statusText.innerText = "Status: ATIVADO";
                        statusText.style.color = "var(--success)";
                    } else {
                        statusText.innerText = "Status: DESATIVADO";
                        statusText.style.color = "var(--danger)";
                    }
                })
                .catch(error => {
                    console.error("Erro ao alterar modo dormir:", error);

                    checkbox.checked = !checkbox.checked;
                    alert("Erro de comunicação com o servidor!");
                });
        }
    </script>
</body>
</html>
