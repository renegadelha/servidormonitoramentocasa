<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página com Botões</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .container {
            text-align: center;
        }
        iframe {
            width: 80%;
            height: 400px;
            border: 2px solid #ddd;
            margin-top: 20px;

        }
        a {
            display: inline-block;
            margin: 20px;
            padding: 20px 40px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        a:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="http://192.168.0.100/abrir" target="iframe1">Abrir</a>
        <a href="http://192.168.0.100/fechar" target="iframe1">Fechar</a>
        <iframe name="iframe1" id="iframe1"></iframe>
    </div>
</body>
</html>
